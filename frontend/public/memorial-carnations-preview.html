const candle='<svg class="avatar-candle" viewBox="0 0 34 85" aria-hidden="true"><defs><linearGradient id="wax"><stop stop-color="#b59b70"/><stop offset=".45" stop-color="#f3e4bd"/><stop offset="1" stop-color="#a98e60"/></linearGradient></defs><path d="M17 22C6 16 15 6 17 0C19 8 28 16 17 22" fill="#ffd482"/><path d="M17 20V26" stroke="#59452d"/><rect x="10" y="24" width="14" height="58" rx="2" fill="url(#wax)"/><ellipse cx="17" cy="24" rx="7" ry="2" fill="#f9eac7"/><ellipse cx="17" cy="82" rx="9" ry="2" fill="#9d804f"/></svg>';

function layout(m,b){document.body.classList.toggle('mobile',m);document.querySelectorAll('.tools button').forEach(e=>e.setAttribute('aria-pressed',e===b))}function menu(b){const d=b.nextElementSibling,open=d.hidden;document.querySelectorAll('.dropdown').forEach(e=>e.hidden=true);document.querySelectorAll('.more').forEach(e=>e.setAttribute('aria-expanded',false));d.hidden=!open;b.setAttribute('aria-expanded',open)}function demo(b){if(b.textContent==='Оформление'){openAppearance();b.parentElement.hidden=true;return}const t=document.getElementById('toast');t.textContent=b.textContent+' · демонстрация';t.hidden=false;b.parentElement.hidden=true;setTimeout(()=>t.hidden=true,1600)}

const leaf='<svg viewBox="0 0 80 50" aria-hidden="true"><path d="M5 43Q42 29 72 8" stroke="#7d8b6b" stroke-width="2" fill="none"/><g fill="#889779"><ellipse cx="25" cy="32" rx="14" ry="5" transform="rotate(18 25 32)"/><ellipse cx="45" cy="24" rx="13" ry="5" transform="rotate(-50 45 24)"/><ellipse cx="62" cy="13" rx="12" ry="4" transform="rotate(15 62 13)"/></g></svg>';

const picker=document.createElement('dialog');picker.id='flower-picker';picker.innerHTML='<h2>Оставить цветы</h2><p>Все три варианта бесплатные. Они появятся маленьким знаком посетителя на 24 часа; семейный букет останется.</p><div class="flower-options">'+Object.entries(flowerNames).map(([k,n])=>`<button class="flower-choice" data-kind="${k}" aria-pressed="${k==='red'}" onclick="pickFlower('${k}',this)">${flowerArt(k)}${n}</button>`).join('')+'</div><div class="dialog-actions"><button onclick="picker.close()">Отмена</button><button onclick="confirmFlower()">Оставить</button></div>';document.body.append(picker);
let demoHour=0,candleAt=null,flowerAt=null,flowerKind=null,choice='red',history=[];
function renderDemo(){const candleLive=candleAt!==null&&demoHour-candleAt<24;const flowerLive=flowerAt!==null&&demoHour-flowerAt<24;firstHero.classList.toggle('demo-lit',candleLive);firstHero.classList.toggle('demo-unlit',!candleLive);document.getElementById('light-candle').textContent=candleLive?'Свеча зажжена':'Зажечь свечу';document.getElementById('light-candle').setAttribute('aria-pressed',candleLive);let sign=firstHero.querySelector('.guest-sign');if(sign)sign.remove();if(flowerLive){sign=document.createElement('div');sign.className='guest-sign';sign.innerHTML=flowerArt(flowerKind)+'<span>Цветы посетителя</span>';firstHero.querySelector('.memory').append(sign)}document.getElementById('demo-status').textContent=(candleLive?'Свеча: осталось '+(24-demoHour+candleAt)+' ч.':candleAt===null?'Свеча ещё не зажжена.':'Свеча погасла через 24 часа.')+' '+(flowerLive?flowerNames[flowerKind]+': осталось '+(24-demoHour+flowerAt)+' ч.':flowerAt===null?'Цветы ещё не оставлены.':'Цветы посетителя скрыты через 24 часа.');document.getElementById('history-list').innerHTML=history.length?history.map(e=>`<li>${e.label} · час ${e.at} · ${demoHour-e.at>=24?'завершено':'активно'}</li>`).join(''):'<li>Пока нет знаков внимания.</li>';}
function lightCandle(){if(candleAt!==null&&demoHour-candleAt<24)return;candleAt=demoHour;history.push({label:'Посетитель зажёг свечу',at:demoHour});renderDemo()}
function openFlowers(){picker.showModal()}function pickFlower(k,b){choice=k;picker.querySelectorAll('.flower-choice').forEach(e=>e.setAttribute('aria-pressed',e===b))}
function confirmFlower(){if(flowerAt!==null&&demoHour-flowerAt<24){if(flowerKind!==choice){flowerKind=choice;const last=history.findLast(e=>e.type==='flower'&&e.at===flowerAt);if(last)last.label='Посетитель оставил: '+flowerNames[choice];}}else{flowerAt=demoHour;flowerKind=choice;history.push({type:'flower',label:'Посетитель оставил: '+flowerNames[choice],at:demoHour});}picker.close();renderDemo()}
function setHour(h,b){demoHour=h;controls.querySelectorAll('[data-hour]').forEach(e=>e.setAttribute('aria-pressed',e===b));renderDemo()}
function resetDemo(){demoHour=0;candleAt=null;flowerAt=null;flowerKind=null;choice='red';history=[];controls.querySelectorAll('[data-hour]').forEach(e=>e.setAttribute('aria-pressed',+e.dataset.hour===0));picker.querySelectorAll('.flower-choice').forEach(e=>e.setAttribute('aria-pressed',e.dataset.kind==='red'));renderDemo()}renderDemo();

const appearanceDefaults={text:'Тепло, которое\nостаётся с нами',flowers:'red_carnations',candle:'classic'};
let appearance={...appearanceDefaults};try{const saved=JSON.parse(localStorage.getItem('vspomin-memorial-appearance-demo')||'null');if(saved)appearance={...appearanceDefaults,...saved}}catch{}
let appearanceDraft={...appearance};
const candleMarkup={lampada:'<path d="M17 45C10 39 15 32 17 26C19 33 24 40 17 45" fill="#ffd482"/><path d="M6 30H28L25 77H9Z" fill="#982d25" fill-opacity=".8" stroke="#d6b786"/><rect x="14" y="47" width="6" height="23" fill="#ead3a1"/><path d="M4 30L9 21H25L30 30ZM7 77H27V82H7Z" fill="#b49867"/>',classic:'<path d="M17 22C6 16 15 6 17 0C19 8 28 16 17 22" fill="#ffd482"/><rect x="10" y="24" width="14" height="58" rx="2" fill="url(#demoWax)"/><ellipse cx="17" cy="82" rx="9" ry="2" fill="#9d804f"/>',taper:'<path d="M17 19C8 13 15 5 17 0C19 7 25 13 17 19" fill="#ffd482"/><path d="M14 22H20L22 77H12Z" fill="url(#demoWax)"/><path d="M9 77H25L28 84H6Z" fill="#a48753"/>',votive:'<path d="M17 40C8 34 15 25 17 19C19 26 25 34 17 40" fill="#ffd482"/><rect x="6" y="42" width="22" height="37" rx="4" fill="#d6b985" fill-opacity=".4" stroke="#bda576"/><rect x="10" y="45" width="14" height="29" rx="2" fill="url(#demoWax)"/>',lantern:'<path d="M17 46C9 40 15 33 17 27C19 34 24 40 17 46" fill="#ffd482"/><path d="M7 29H27L25 75H9Z" fill="#c3a571" fill-opacity=".14" stroke="#a98c57"/><rect x="13" y="47" width="8" height="22" fill="url(#demoWax)"/><path d="M5 29L11 20H23L29 29ZM7 75H27L29 81H5Z" fill="#9e814d"/><path d="M12 20V14Q17 5 22 14V20" fill="none" stroke="#a78b56" stroke-width="2"/>'};
function appearanceCandle(kind){return '<defs><linearGradient id="demoWax"><stop stop-color="#b59b70"/><stop offset=".45" stop-color="#f3e4bd"/><stop offset="1" stop-color="#a98e60"/></linearGradient></defs>'+(candleMarkup[kind]||candleMarkup.classic)}
function applyAppearance(value){const quote=firstHero.querySelector('.quote');quote.classList.add('appearance-quote');quote.textContent=value.text;firstHero.classList.toggle('family-none',value.flowers==='none');firstHero.classList.toggle('family-white',value.flowers==='white_carnations');firstHero.querySelector('.avatar').classList.toggle('no-candle',value.candle==='none');firstHero.querySelector('.avatar-candle').innerHTML=appearanceCandle(value.candle);renderDemo()}
const appearancePicker=document.createElement('dialog');appearancePicker.id='appearance-picker';appearancePicker.innerHTML='<h2>Оформление страницы</h2><p>Предпросмотр меняется сразу. Сохранение действует только в этом браузере, в демонстрации.</p><label for="appearance-text">Семейная фраза</label><textarea id="appearance-text" maxlength="160"></textarea><div class="help"><span id="appearance-count"></span> / 160 символов</div><label for="appearance-flowers">Семейная композиция</label><select id="appearance-flowers"><option value="red_carnations">Красные гвоздики</option><option value="white_carnations">Белые гвоздики</option><option value="none">Без цветов</option></select><label for="appearance-candle">Свеча у портрета</label><select id="appearance-candle"><option value="classic">Классическая</option><option value="taper">Тонкая на подсвечнике</option><option value="votive">Свеча в стакане</option><option value="lampada">Лампадка</option><option value="lantern">Фонарь</option><option value="none">Без свечи</option></select><div class="appearance-actions"><button id="appearance-reset" type="button">Сбросить</button><div><button id="appearance-cancel" type="button">Отмена</button> <button id="appearance-save" type="button">Сохранить</button></div></div>';document.body.append(appearancePicker);
function fillAppearance(){appearancePicker.querySelector('textarea').value=appearanceDraft.text;appearancePicker.querySelector('#appearance-flowers').value=appearanceDraft.flowers;appearancePicker.querySelector('#appearance-candle').value=appearanceDraft.candle;appearancePicker.querySelector('#appearance-count').textContent=appearanceDraft.text.length}
function openAppearance(){appearanceDraft={...appearance};fillAppearance();appearancePicker.showModal()}
appearancePicker.addEventListener('input',()=>{appearanceDraft={text:appearancePicker.querySelector('textarea').value,flowers:appearancePicker.querySelector('#appearance-flowers').value,candle:appearancePicker.querySelector('#appearance-candle').value};appearancePicker.querySelector('#appearance-count').textContent=appearanceDraft.text.length;applyAppearance(appearanceDraft)});
appearancePicker.querySelector('#appearance-save').onclick=()=>{appearance={...appearanceDraft};localStorage.setItem('vspomin-memorial-appearance-demo',JSON.stringify(appearance));appearancePicker.close();applyAppearance(appearance)};
appearancePicker.querySelector('#appearance-cancel').onclick=()=>{appearancePicker.close();applyAppearance(appearance)};
appearancePicker.querySelector('#appearance-reset').onclick=()=>{appearanceDraft={...appearanceDefaults};fillAppearance();applyAppearance(appearanceDraft)};
appearancePicker.addEventListener('cancel',()=>applyAppearance(appearance));applyAppearance(appearance);
</script><script>
const demoVisitors={family:{name:'Анна',candleAt:null,flowerAt:null,flowerKind:null},relative:{name:'Сергей',candleAt:null,flowerAt:null,flowerKind:null},guest:{name:'Посетитель',candleAt:null,flowerAt:null,flowerKind:null}};let activeVisitor='family';
const visitorBar=document.createElement('div');visitorBar.className='demo-time';visitorBar.innerHTML='<label>Посетитель <select id="demo-visitor"><option value="family">Анна</option><option value="relative">Сергей</option><option value="guest">Посетитель</option></select></label>';controls.prepend(visitorBar);
function rememberVisitor(){Object.assign(demoVisitors[activeVisitor],{candleAt,flowerAt,flowerKind})}
function syncVisitors(){rememberVisitor();const people=Object.values(demoVisitors).filter(v=>v.candleAt!==null&&demoHour-v.candleAt<24&&demoHour>=v.candleAt);window.dispatchEvent(new CustomEvent('memorial-demo-signs',{detail:{lit:people.length>0,people:people.map(v=>({display_name:v.name}))}}));}
const originalLight=lightCandle,originalFlower=confirmFlower,originalHour=setHour,originalReset=resetDemo;
lightCandle=function(){const n=history.length;originalLight();if(history.length>n)history[history.length-1].label=demoVisitors[activeVisitor].name+' зажёг(ла) свечу';renderDemo();syncVisitors()};
confirmFlower=function(){const n=history.length;originalFlower();if(history.length>n)history[history.length-1].label=demoVisitors[activeVisitor].name+' оставил(а): '+flowerNames[flowerKind];renderDemo();syncVisitors()};
setHour=function(h,b){originalHour(h,b);syncVisitors()};resetDemo=function(){originalReset();Object.values(demoVisitors).forEach(v=>Object.assign(v,{candleAt:null,flowerAt:null,flowerKind:null}));syncVisitors()};
document.getElementById('demo-visitor').onchange=e=>{rememberVisitor();activeVisitor=e.target.value;({candleAt,flowerAt,flowerKind}=demoVisitors[activeVisitor]);renderDemo();syncVisitors()};
</script><script src="memorial-editor-preview.js"></script></body></html>
